<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAFIATOTO - Banner Promosi Resmi</title>
    
    <!-- Kode Verifikasi Google Search Console -->
    <meta name="google-site-verification" content="a6c87b288dad84e4" />

    <!-- Meta Tags SEO untuk Pencarian -->
    <meta name="description" content="Situs resmi banner promosi MAFIATOTO gacor maxwin setiap hari. Mainkan game seru dengan karakter Hinata dan dapatkan kemenangan besar sekarang!">
    <meta name="keywords" content="mafiatoto, slot gacor, link alternatif mafiatoto, banner mafiatoto, situs resmi mafiatoto">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background-color: #0b0f19;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .banner-container {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 850px;
            background: linear-gradient(135deg, #1a1c29 0%, #0b0f19 100%);
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 2px solid #ff4757;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            text-decoration: none;
        }
        /* Marquee / Teks Berjalan */
        .marquee-container {
            width: 100%;
            background: rgba(255, 71, 87, 0.9);
            color: #fff;
            padding: 8px 0;
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 1px;
            overflow: hidden;
            white-space: nowrap;
            z-index: 10;
            box-shadow: 0 4px 10px rgba(255, 71, 87, 0.4);
        }
        .marquee-text {
            display: inline-block;
            animation: marquee 12s linear infinite;
        }
        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
        /* Konten Tengah (Hinata & Efek) */
        .content-area {
            position: relative;
            flex: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .character-img {
            width: 85%;
            max-height: 75vh;
            object-fit: contain;
            filter: drop-shadow(0 0 15px rgba(255, 71, 87, 0.6));
            animation: float 3s ease-in-out infinite;
            z-index: 3;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        /* Partikel Sederhana */
        .particle {
            position: absolute;
            background: #ff4757;
            border-radius: 50%;
            animation: rise 4s linear infinite;
            opacity: 0.7;
            z-index: 2;
        }
        @keyframes rise {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-20vh) scale(1); opacity: 0; }
        }
        /* Tombol & Watermark */
        .cta-button {
            background: linear-gradient(45deg, #ff4757, #ff6b81);
            color: white;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.5);
            margin-bottom: 20px;
            z-index: 10;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .watermark {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 2px;
            margin-bottom: 10px;
            z-index: 10;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <a href="https://ln.run/HFWyc" target="_blank" class="banner-container">
        <!-- Marquee Teks Berjalan -->
        <div class="marquee-container">
            <div class="marquee-text">🔥 SELAMAT DATANG DI MAFIATOTO - SITUS TERPERCAYA, GACOR SETIAP HARI, MENANGKAN HADIAH UTAMA SEKARANG! 🔥</div>
        </div>

        <!-- Area Gambar & Partikel -->
        <div class="content-area" id="particle-area">
            <img src="hinata.jpg" alt="Hinata MAFIATOTO" class="character-img">
        </div>

        <!-- Tombol Aksi -->
        <div class="cta-button">DAFTAR & MAIN SEKARANG</div>

        <!-- Watermark -->
        <div class="watermark">KENMAFIA</div>
    </a>

    <script>
        // Script Generator Partikel Otomatis
        const area = document.getElementById('particle-area');
        for (let i = 0; i < 20; i++) {
            let p = document.createElement('div');
            p.className = 'particle';
            let size = Math.random() * 6 + 2;
            p.style.width = size + 'px';
            p.style.height = size + 'px';
            p.style.left = Math.random() * 100 + '%';
            p.style.animationDuration = (Math.random() * 3 + 2) + 's';
            p.style.animationDelay = (Math.random() * 2) + 's';
            area.appendChild(p);
        }
    </script>

</body>
</html>
