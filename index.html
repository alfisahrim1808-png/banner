<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAFIATOTO - Official Portal & Link Alternatif Resmi</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #05070b;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
            overflow-x: hidden;
        }

        /* Container Utama dengan Bingkai Besar Kelap-Kelip Rainbow */
        .portal-outer-glow {
            position: relative;
            width: 100%;
            max-width: 480px;
            border-radius: 18px;
            padding: 3px; /* Ketebalan bingkai pelangi */
            z-index: 1;
        }

        /* Lapisan Efek Pelangi Berputar & Kelap-Kelip Mengelilingi Bingkai Besar */
        .portal-outer-glow::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 18px;
            background: linear-gradient(45deg, #ff0000, #ff7300, #ffeb00, #10ff00, #00ffff, #002bff, #7a00ff, #ff00c8, #ff0000);
            background-size: 400%;
            z-index: -1;
            animation: rainbowBorderGlow 4s linear infinite;
        }

        @keyframes rainbowBorderGlow {
            0% {
                background-position: 0% 50%;
                filter: brightness(1);
                box-shadow: 0 0 15px rgba(255, 0, 0, 0.5), 0 0 30px rgba(0, 255, 255, 0.4);
            }
            50% {
                background-position: 100% 50%;
                filter: brightness(1.3);
                box-shadow: 0 0 25px rgba(255, 215, 0, 0.8), 0 0 40px rgba(0, 255, 128, 0.6);
            }
            100% {
                background-position: 0% 50%;
                filter: brightness(1);
                box-shadow: 0 0 15px rgba(255, 0, 0, 0.5), 0 0 30px rgba(0, 255, 255, 0.4);
            }
        }

        .portal-wrapper {
            position: relative;
            width: 100%;
            background: #161b22;
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 20px;
        }

        /* Header / Judul Situs */
        .portal-header {
            text-align: center;
            margin-bottom: 20px;
            width: 100%;
            overflow: hidden;
            padding: 5px 0;
        }

        .portal-header h1 {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            display: flex;
            justify-content: center;
            gap: 2px;
        }

        /* Animasi Huruf Lembut & Elegan */
        .portal-header h1 span {
            display: inline-block;
            opacity: 0;
            transform: translateX(-50px);
            animation: letterAnim 4s infinite ease-in-out;
        }

        .portal-header h1 span:nth-child(1) { animation-delay: 0.05s; }
        .portal-header h1 span:nth-child(2) { animation-delay: 0.1s; }
        .portal-header h1 span:nth-child(3) { animation-delay: 0.15s; }
        .portal-header h1 span:nth-child(4) { animation-delay: 0.2s; }
        .portal-header h1 span:nth-child(5) { animation-delay: 0.25s; }
        .portal-header h1 span:nth-child(6) { animation-delay: 0.3s; }
        .portal-header h1 span:nth-child(7) { animation-delay: 0.35s; }
        .portal-header h1 span:nth-child(8) { animation-delay: 0.4s; }
        .portal-header h1 span:nth-child(9) { animation-delay: 0.45s; }

        @keyframes letterAnim {
            0% {
                opacity: 0;
                transform: translateX(-60px);
                color: #ffffff;
                text-shadow: none;
            }
            20% {
                opacity: 1;
                transform: translateX(0);
                color: #00ffff;
                text-shadow: 0 0 12px #00ffff, 0 0 25px rgba(0,255,255,0.5);
            }
            35% {
                color: #ffd700;
                text-shadow: 0 0 15px #ffd700, 0 0 30px rgba(255,215,0,0.6);
            }
            70% {
                opacity: 1;
                transform: translateX(0);
                color: #ffffff;
                text-shadow: 0 0 6px rgba(255,255,255,0.4);
            }
            95%, 100% {
                opacity: 0;
                transform: translateX(60px);
                color: #ffffff;
                text-shadow: none;
            }
        }

        .portal-header p {
            font-size: 13px;
            color: #8b949e;
            letter-spacing: 0.5px;
            margin-top: 4px;
        }

        /* Area Gambar Banner dengan Animasi Gerak Halus (Floating) */
        .banner-card {
            position: relative;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: #0d1117;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            text-decoration: none;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
            animation: floatBanner 4s ease-in-out infinite;
        }

        @keyframes floatBanner {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-8px);
            }
        }

        .banner-card img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
        }

        /* Tombol Aksi Utama (CTA) dengan Efek Kilau Halus & Mewah */
        .btn-action {
            position: relative;
            width: 100%;
            background: linear-gradient(135deg, #238636 0%, #2ea043 100%);
            color: #ffffff;
            padding: 14px 0;
            font-size: 16px;
            font-weight: 700;
            text-align: center;
            border-radius: 8px;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(35, 134, 54, 0.4);
            transition: all 0.4s ease;
            display: block;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            overflow: hidden;
            z-index: 1;
        }

        .btn-action::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.2),
                transparent
            );
            transition: 0.5s;
            animation: smoothShimmer 4s infinite;
        }

        @keyframes smoothShimmer {
            0% { left: -100%; }
            20% { left: 100%; }
            100% { left: 100%; }
        }

        .btn-action:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(46, 160, 67, 0.6);
            background: linear-gradient(135deg, #2ea043 0%, #238636 100%);
        }

        .btn-alt {
            background: linear-gradient(135deg, #21262d 0%, #30363d 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #c9d1d9;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        .btn-alt:hover {
            background: linear-gradient(135deg, #30363d 0%, #484f58 100%);
            color: #ffffff;
            border-color: rgba(255, 215, 0, 0.4);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
        }

        /* Footer Copyright & KENMAFIA Biasa */
        .portal-footer {
            margin-top: 15px;
            text-align: center;
            width: 100%;
        }

        .copyright {
            font-size: 12px;
            color: #8b949e;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .kenmafia-text {
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
        }
    </style>
</head>
<body>

    <!-- Bingkai Besar Kelap-Kelip Rainbow di Luar -->
    <div class="portal-outer-glow">
        <div class="portal-wrapper">
            <!-- Header dengan Animasi Huruf Mengalir Halus -->
            <div class="portal-header">
                <h1>
                    <span>M</span><span>A</span><span>F</span><span>I</span><span>A</span><span>T</span><span>O</span><span>T</span><span>O</span>
                </h1>
                <p>Official Portal & Link Alternatif Resmi</p>
            </div>

            <!-- Banner Utama dengan Efek Gerak Halus -->
            <a href="https://ln.run/HFWyc" target="_blank" class="banner-card">
                <img src="hinata.jpg" alt="MAFIATOTO Banner">
            </a>

            <!-- Tombol Menu Aksi dengan Kilau Halus -->
            <a href="https://ln.run/HFWyc" target="_blank" class="btn-action">DAFTAR SEKARANG</a>
            <a href="https://ln.run/HFWyc" target="_blank" class="btn-action btn-alt">LOGIN ALTERNATIF</a>

            <!-- Footer dengan KENMAFIA di Bawah -->
            <div class="portal-footer">
                <div class="copyright">&copy; 2026 MAFIATOTO. All Rights Reserved.</div>
                <div class="kenmafia-text">KENMAFIA</div>
            </div>
        </div>
    </div>

</body>
</html>
