<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAFIATOTO - Situs Resmi Banner Promosi Eksklusif</title>
    
    <!-- Meta Tags SEO -->
    <meta name="description" content="Situs resmi banner promosi MAFIATOTO gacor maxwin setiap hari dengan pengalaman visual mewah dan pelayanan terbaik.">
    <meta name="keywords" content="mafiatoto, slot gacor, link alternatif mafiatoto, banner mafiatoto, situs resmi mafiatoto">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body, html {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: #05070b;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Container Utama dengan Efek Glassmorphism & Border Mewah */
        .banner-container {
            position: relative;
            width: 100%;
            max-width: 450px;
            height: 100vh;
            max-height: 850px;
            background: radial-gradient(circle at center, #1a2238 0%, #080b12 100%);
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9), 0 0 30px rgba(255, 215, 0, 0.15);
            border: 2px solid rgba(255, 215, 0, 0.4);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            text-decoration: none;
            border-radius: 12px;
        }

        /* Header Marquee Mewah dengan Gradasi Emas & Merah Mewah */
        .marquee-wrapper {
            width: 100%;
            background: linear-gradient(90deg, #b31217, #e52d27, #ffd700, #e52d27, #b31217);
            background-size: 300% 100%;
            animation: goldShine 6s linear infinite;
            padding: 10px 0;
            box-shadow: 0 4px 15px rgba(229, 45, 39, 0.5);
            z-index: 10;
        }

        @keyframes goldShine {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .marquee-container {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
        }

        .marquee-text {
            display: inline-block;
            color: #ffffff;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 1.5px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
            animation: marquee 14s linear infinite;
        }

        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        /* Area Konten & Karakter */
        .content-area {
            position: relative;
            flex: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 0;
        }

        .character-img {
            width: 90%;
            max-height: 70vh;
            object-fit: contain;
            filter: drop-shadow(0 0 25px rgba(255, 215, 0, 0.4));
            animation: floatSmooth 4s ease-in-out infinite;
            z-index: 3;
        }

        @keyframes floatSmooth {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-12px) scale(1.02); }
        }

        /* Partikel Berkilau Emas Di background */
        .particle {
            position: absolute;
            background: radial-gradient(circle, #fff 0%, #ffd700 70%, transparent 100%);
            border-radius: 50%;
            animation: riseParticle linear infinite;
            opacity: 0.8;
            z-index: 2;
        }

        @keyframes riseParticle {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            30% { opacity: 0.9; }
            100% { transform: translateY(-15vh) scale(1.2); opacity: 0; }
        }

        /* Tombol CTA (Call To Action) Ekstrem Mewah */
        .cta-container {
            width: 100%;
            padding: 0 20px 25px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        .cta-button {
            position: relative;
            width: 100%;
            background: linear-gradient(135deg, #ffd700 0%, #ff8c00 50%, #ff4500 100%);
            color: #1a0800;
            padding: 16px 0;
            font-size: 18px;
            font-weight: 800;
            text-align: center;
            border-radius: 50px;
            box-shadow: 0 10px 25px rgba(255, 140, 0, 0.6), inset 0 2px 3px rgba(255, 255, 255, 0.6);
            letter-spacing: 1px;
            text-transform: uppercase;
            overflow: hidden;
            transition: all 0.3s ease;
            animation: pulseGlow 2s infinite;
        }

        .cta-button::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(60deg, transparent, rgba(255,255,255,0.4), transparent);
            transform: rotate(30deg) translateX(-100%);
            animation: shineEffect 3s infinite;
        }

        @keyframes shineEffect {
            0% { transform: rotate(30deg) translateX(-100%); }
            20% { transform: rotate(30deg) translateX(100%); }
            100% { transform: rotate(30deg) translateX(100%); }
        }

        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); box-shadow: 0 10px 25px rgba(255, 140, 0, 0.6); }
            50% { transform: scale(1.03); box-shadow: 0 15px 35px rgba(255, 215, 0, 0.8); }
        }

        /* Watermark Elegan */
        .watermark {
            margin-top: 15px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <a href="https://ln.run/HFWyc" target="_blank" class="banner-container">
        <!-- Marquee Teks Berjalan Mewah -->
        <div class="marquee-wrapper">
            <div class="marquee-container">
                <div class="marquee-text">⭐ SELAMAT DATANG DI SITUS RESMI MAFIATOTO - SLOT GACOR MAXWIN SETIAP HARI DENGAN HADIAH TERBESAR! ⭐</div>
            </div>
        </div>

        <!-- Area Gambar & Partikel Dinamis -->
        <div class="content-area" id="particle-area">
            <img src="hinata.jpg" alt="Hinata MAFIATOTO" class="character-img">
        </div>

        <!-- Bagian Tombol Interaktif -->
        <div class="cta-container">
            <div class="cta-button">DAFTAR & MAIN SEKARANG</div>
            <div class="watermark">KENMAFIA EXCLUSIVE</div>
        </div>
    </a>

    <script>
        // Generator Partikel Berkilau (Aman & Ringan Tanpa Bug)
        const area = document.getElementById('particle-area');
        const particleCount = 18;
        
        for (let i = 0; i < particleCount; i++) {
            let p = document.createElement('div');
            p.className = 'particle';
            let size = Math.random() * 5 + 3;
            p.style.width = size + 'px';
            p.style.height = size + 'px';
            p.style.left = Math.random() * 100 + '%';
            p.style.animationDuration = (Math.random() * 3 + 2.5) + 's';
            p.style.animationDelay = (Math.random() * 3) + 's';
            area.appendChild(p);
        }
    </script>

</body>
</html>
